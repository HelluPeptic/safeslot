plugins {
    id 'fabric-loom' version '1.13-SNAPSHOT'
    id 'maven-publish'
    id 'idea'
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://maven.shedaniel.me/" }
    mavenCentral()
    maven { url "https://github.com/Serilum/.maven/raw/maven/" }
    // Added LuckPerms official repository for API resolution
    maven { url 'https://repo.lucko.me/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "org.jetbrains:annotations:23.0.0"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    annotationProcessor 'com.google.code.gson:gson:2.10.1'
    compileOnly 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.guava:guava:32.1.2-jre'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'
    compileOnly 'com.google.guava:guava:32.1.2-jre'

    modApi("com.terraformersmc:modmenu:11.0.1") { exclude(module: "fabric-api") }

    modImplementation "me.lucko:fabric-permissions-api:0.2-SNAPSHOT"
    include "me.lucko:fabric-permissions-api:0.2-SNAPSHOT"
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

version = rootProject.version

processResources {
    from(sourceSets.main.resources) // Ensure Fabric's own resources (including fabric.mod.json) are included
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${mod_name}" }
    }
    // Add Implementation-Version to manifest for dynamic version command
    manifest {
        attributes(
            'Implementation-Version': project.version
        )
    }
    // Do not override defaults; compiled classes and resources are included by default
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.name
            version project.version
            from components.java
        }
    }

    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

archivesBaseName = 'safeslot-fabric-1.21.11'


